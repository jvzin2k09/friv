    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#727b88"/><stop offset="1" stop-color="#303745"/></linearGradient>
    <linearGradient id="orange" x2="0" y2="1"><stop stop-color="#ffae3b"/><stop offset="1" stop-color="#e45b26"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#4da9ff"/><stop offset="1" stop-color="#214baf"/></linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#sky)"/>
