<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Prison Life</title>
  <desc id="desc">Arte original para o jogo Prison Life, com personagens em uma prisão estilizada.</desc>
  <defs>
